[project]
name = "dutyflow-common"
version = "0.1.0"
description = "Общий код сервисов DutyFlow 2: auth, scope, аудит, outbox, БД, ошибки"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dutyflow_common"]
