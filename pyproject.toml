# Корень uv workspace: сам по себе не пакет, объединяет libs/common и сервисы.
[project]
name = "dutyflow"
version = "0.1.0"
description = "DutyFlow 2 — распределение нарядов и личного состава"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.8",
    "asgi-lifespan>=2.1",
]
# Экспериментальный стенд (`just experiment`): графики — только здесь, не в образах сервисов
experiment = ["matplotlib>=3.9"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/common", "services/*"]

[tool.uv.sources]
dutyflow-common = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "**/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "S", "SIM", "RUF", "PT", "TID"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях — нормально
    "S101",                        # assert в тестах
    "B008",                        # FastAPI Depends(...) в аргументах по умолчанию
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]
"tools/**" = ["S311"]  # синтетика и бенчмарки: детерминированный random по seed — это намеренно
"deploy/demo/**" = ["S311"]  # демо-данные: детерминированный random по seed
"services/allocation/src/allocation/synthetic.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["allocation", "analytics", "auth_admin", "documents", "dutyflow_common", "org", "personnel", "scheduling"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/", "frontend/"]
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "libs/common/src",
    "services/org/src",
    "services/personnel/src",
    "services/scheduling/src",
    "services/allocation/src",
    "services/documents/src",
    "services/analytics/src",
    "services/auth_admin/src",
]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "asgi_lifespan.*", "asyncpg.*", "scipy.*", "yaml.*", "ortools.graph.*", "openpyxl.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
