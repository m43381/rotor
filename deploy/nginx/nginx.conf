# Шлюз DutyFlow: раздаёт SPA, проксирует /api/<service>/ и /auth/ (Keycloak).
# TLS на внутреннем CA добавляется в фазе 7 (ADR-0007); сейчас стенд работает по HTTP.

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream org_upstream       { server org:8000; }
upstream personnel_upstream { server personnel:8000; }
upstream keycloak_upstream { server keycloak:8080; }

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Request-Id      $req_id;

    # Внутренние batch-эндпоинты сервисов наружу не выставляются.
    location ~ ^/api/[^/]+/internal/ {
        return 404;
    }

    location /api/org/ {
        proxy_pass http://org_upstream/;
    }

    location /api/personnel/ {
        proxy_pass http://personnel_upstream/;
    }

    location /auth/ {
        proxy_pass http://keycloak_upstream;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        location ~* \.(js|css|woff2?|svg|png|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
