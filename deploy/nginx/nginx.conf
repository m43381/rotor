# Шлюз DutyFlow: раздаёт SPA, проксирует /api/<service>/ и /auth/ (Keycloak).
# Только HTTP (ADR-0021): внешний порт задаётся в .env (GATEWAY_PORT), внутри контейнера — 80.

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

# DNS Docker: адреса контейнеров перечитываются, когда сервис пересоздан (например, Keycloak
# после смены SERVER_HOST), — без перезапуска шлюза и без 502 на старый IP
resolver 127.0.0.11 valid=10s ipv6=off;

upstream org_upstream        { zone org 64k;        server org:8000 resolve; }
upstream personnel_upstream  { zone personnel 64k;  server personnel:8000 resolve; }
upstream scheduling_upstream { zone scheduling 64k; server scheduling:8000 resolve; }
upstream documents_upstream  { zone documents 64k;  server documents:8000 resolve; }
upstream analytics_upstream  { zone analytics 64k;  server analytics:8000 resolve; }
upstream auth_admin_upstream { zone auth_admin 64k; server auth-admin:8000 resolve; }
upstream keycloak_upstream   { zone keycloak 64k;   server keycloak:8080 resolve; }

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Request-Id      $req_id;

    # Внутренние batch-эндпоинты сервисов наружу не выставляются.
    location ~ ^/api/[^/]+/internal/ {
        return 404;
    }

    location /api/org/ {
        proxy_pass http://org_upstream/;
    }

    location /api/personnel/ {
        proxy_pass http://personnel_upstream/;
    }

    location /api/scheduling/ {
        proxy_pass http://scheduling_upstream/;
    }

    location /api/documents/ {
        proxy_pass http://documents_upstream/;
        # Крупный импорт проверяется и применяется дольше обычного запроса
        proxy_read_timeout 180s;
    }

    location /api/analytics/ {
        proxy_pass http://analytics_upstream/;
    }

    location /api/auth-admin/ {
        proxy_pass http://auth_admin_upstream/;
    }

    location /auth/ {
        proxy_pass http://keycloak_upstream;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        location ~* \.(js|css|woff2?|svg|png|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
