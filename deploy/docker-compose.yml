# Стенд DutyFlow 2. Запуск: `just up` (создаёт deploy/.env и поднимает всё).
# Все образы собираются или берутся заранее: во время работы стенд не обращается в интернет.
name: dutyflow

x-service-env: &service-env
  REDIS_URL: redis://redis:6379/0
  OIDC_ISSUER: ${PUBLIC_URL}/auth/realms/dutyflow
  OIDC_JWKS_URL: http://keycloak:8080/auth/realms/dutyflow/protocol/openid-connect/certs
  OIDC_AUDIENCE: dutyflow-api
  INTERNAL_TOKEN: ${INTERNAL_TOKEN}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Часовой пояс инсталляции: время нарядов локальное (ADR-0008)
  TIMEZONE: ${TIMEZONE:-Europe/Moscow}

# Ротация логов Docker: до 5 файлов по 20 МБ на контейнер
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    logging: *logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Одноразово создаёт недостающие БД и роли сервисов (в том числе на уже существующем томе).
  db-init:
    logging: *logging
    image: postgres:16-alpine
    command: ["sh", "/ensure-databases.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ORG_DB_PASSWORD: ${ORG_DB_PASSWORD}
      PERSONNEL_DB_PASSWORD: ${PERSONNEL_DB_PASSWORD}
      SCHEDULING_DB_PASSWORD: ${SCHEDULING_DB_PASSWORD}
      DOCUMENTS_DB_PASSWORD: ${DOCUMENTS_DB_PASSWORD}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
      AUTH_ADMIN_DB_PASSWORD: ${AUTH_ADMIN_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ./postgres/ensure-databases.sh:/ensure-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    logging: *logging
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    logging: *logging
    image: quay.io/keycloak/keycloak:26.3
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_URL}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Подставляются в realm-файл при импорте (плейсхолдеры ${...})
      PUBLIC_URL: ${PUBLIC_URL}
      ROOT_UNIT_ID: ${ROOT_UNIT_ID}
      DUTYFLOW_ADMIN_PASSWORD: ${DUTYFLOW_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/dutyflow-realm.json:/opt/keycloak/data/import/dutyflow-realm.json:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      # В образе нет curl — проверяем management-порт средствами bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  org:
    logging: *logging
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: org
    image: dutyflow/org:${DUTYFLOW_VERSION:-dev}
    environment:
      <<: *service-env
      SERVICE_NAME: org
      DATABASE_URL: postgresql+asyncpg://org:${ORG_DB_PASSWORD}@postgres:5432/org_db
      ROOT_UNIT_ID: ${ROOT_UNIT_ID}
      ROOT_UNIT_NAME: ${ROOT_UNIT_NAME}
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  org-relay:
    logging: *logging
    image: dutyflow/org:${DUTYFLOW_VERSION:-dev}
    command: ["python", "-m", "org.relay"]
    healthcheck:
      disable: true  # HTTP-порта у релея нет; проверка из Dockerfile сервиса к нему не относится
    environment:
      <<: *service-env
      SERVICE_NAME: org
      DATABASE_URL: postgresql+asyncpg://org:${ORG_DB_PASSWORD}@postgres:5432/org_db
    depends_on:
      org:
        condition: service_healthy
    restart: unless-stopped

  personnel:
    logging: *logging
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: personnel
    image: dutyflow/personnel:${DUTYFLOW_VERSION:-dev}
    environment: &personnel-env
      <<: *service-env
      SERVICE_NAME: personnel
      DATABASE_URL: postgresql+asyncpg://personnel:${PERSONNEL_DB_PASSWORD}@postgres:5432/personnel_db
      ORG_URL: http://org:8000
      SCHEDULING_URL: http://scheduling:8000
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  personnel-relay:
    logging: *logging
    image: dutyflow/personnel:${DUTYFLOW_VERSION:-dev}
    command: ["python", "-m", "personnel.relay"]
    healthcheck:
      disable: true
    environment: *personnel-env
    depends_on:
      personnel:
        condition: service_healthy
    restart: unless-stopped

  # Один экземпляр: проекции чувствительны к порядку событий (ADR-0011).
  personnel-consumer:
    logging: *logging
    image: dutyflow/personnel:${DUTYFLOW_VERSION:-dev}
    command: ["python", "-m", "personnel.consumer"]
    healthcheck:
      disable: true
    environment: *personnel-env
    depends_on:
      personnel:
        condition: service_healthy
      org:
        condition: service_healthy
      scheduling:
        condition: service_healthy
    restart: unless-stopped

  scheduling:
    logging: *logging
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: scheduling
    image: dutyflow/scheduling:${DUTYFLOW_VERSION:-dev}
    environment: &scheduling-env
      <<: *service-env
      SERVICE_NAME: scheduling
      DATABASE_URL: postgresql+asyncpg://scheduling:${SCHEDULING_DB_PASSWORD}@postgres:5432/scheduling_db
      ORG_URL: http://org:8000
      PERSONNEL_URL: http://personnel:8000
      ALLOCATION_URL: http://allocation:8000
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      allocation:
        condition: service_healthy
    restart: unless-stopped

  scheduling-relay:
    logging: *logging
    image: dutyflow/scheduling:${DUTYFLOW_VERSION:-dev}
    command: ["python", "-m", "scheduling.relay"]
    healthcheck:
      disable: true
    environment: *scheduling-env
    depends_on:
      scheduling:
        condition: service_healthy
    restart: unless-stopped

  # Один экземпляр: проекции чувствительны к порядку событий (ADR-0011).
  scheduling-consumer:
    logging: *logging
    image: dutyflow/scheduling:${DUTYFLOW_VERSION:-dev}
    command: ["python", "-m", "scheduling.consumer"]
    healthcheck:
      disable: true
    environment: *scheduling-env
    depends_on:
      scheduling:
        condition: service_healthy
      org:
        condition: service_healthy
    restart: unless-stopped

  # Движок распределения: без предметной БД, только внутренний API для scheduling (ADR-0006)
  allocation:
    logging: *logging
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: allocation
    image: dutyflow/allocation:${DUTYFLOW_VERSION:-dev}
    environment: &allocation-env
      <<: *service-env
      SERVICE_NAME: allocation
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Фоновые расчёты движка (очередь arq, фаза 5b): CP-SAT с большим пределом, большие снимки
  allocation-worker:
    logging: *logging
    image: dutyflow/allocation:${DUTYFLOW_VERSION:-dev}
    command: ["arq", "allocation.worker.WorkerSettings"]
    healthcheck:
      disable: true
    environment: *allocation-env
    # Большие задачи CP-SAT не должны вытеснять остальной стенд (эталон — 8 CPU / 16 ГБ)
    mem_limit: ${ALLOCATION_WORKER_MEMORY:-4g}
    depends_on:
      allocation:
        condition: service_healthy
    restart: unless-stopped

  # Импорт и печать (фаза 6): чужие данные читает и пишет через публичные API владельцев
  # от имени оператора (ADR-0014); своя БД — только задачи импорта и настройки документов.
  documents:
    logging: *logging
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: documents
    image: dutyflow/documents:${DUTYFLOW_VERSION:-dev}
    environment: &documents-env
      <<: *service-env
      SERVICE_NAME: documents
      DATABASE_URL: postgresql+asyncpg://documents:${DOCUMENTS_DB_PASSWORD}@postgres:5432/documents_db
      PERSONNEL_URL: http://personnel:8000
      SCHEDULING_URL: http://scheduling:8000
      ORG_URL: http://org:8000
      ANALYTICS_URL: http://analytics:8000
    depends_on:
      db-init:
        condition: service_completed_successfully
      personnel:
        condition: service_healthy
      scheduling:
        condition: service_healthy
    restart: unless-stopped

  documents-relay:
    logging: *logging
    image: dutyflow/documents:${DUTYFLOW_VERSION:-dev}
    command: ["python", "-m", "documents.relay"]
    healthcheck:
      disable: true
    environment: *documents-env
    depends_on:
      documents:
        condition: service_healthy
    restart: unless-stopped

  # Read-model нагрузки по событиям scheduling (фаза 6c): не в критическом пути — если
  # analytics недоступен, распределение и графики работают
  analytics:
    logging: *logging
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: analytics
    image: dutyflow/analytics:${DUTYFLOW_VERSION:-dev}
    environment: &analytics-env
      <<: *service-env
      SERVICE_NAME: analytics
      DATABASE_URL: postgresql+asyncpg://analytics:${ANALYTICS_DB_PASSWORD}@postgres:5432/analytics_db
      ORG_URL: http://org:8000
      SCHEDULING_URL: http://scheduling:8000
      # Источники сводного журнала аудита (начальное заполнение, фаза 7b)
      PERSONNEL_URL: http://personnel:8000
      DOCUMENTS_URL: http://documents:8000
      AUTH_ADMIN_URL: http://auth-admin:8000
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Один экземпляр: факты и проекции чувствительны к порядку событий. При пустой read-model
  # заполняет её выгрузкой из scheduling (`just analytics-rebuild` — вручную).
  analytics-consumer:
    logging: *logging
    image: dutyflow/analytics:${DUTYFLOW_VERSION:-dev}
    command: ["python", "-m", "analytics.consumer"]
    healthcheck:
      disable: true
    environment: *analytics-env
    depends_on:
      analytics:
        condition: service_healthy
      org:
        condition: service_healthy
      scheduling:
        condition: service_healthy
    restart: unless-stopped

  # Управление операторами из интерфейса поверх Keycloak Admin API (ADR-0002, фаза 7a)
  auth-admin:
    logging: *logging
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: auth_admin
    image: dutyflow/auth-admin:${DUTYFLOW_VERSION:-dev}
    environment: &auth-admin-env
      <<: *service-env
      SERVICE_NAME: auth-admin
      DATABASE_URL: postgresql+asyncpg://auth_admin:${AUTH_ADMIN_DB_PASSWORD}@postgres:5432/auth_admin_db
      KEYCLOAK_URL: http://keycloak:8080/auth
      AUTH_ADMIN_CLIENT_SECRET: ${AUTH_ADMIN_CLIENT_SECRET}
      ORG_URL: http://org:8000
    depends_on:
      db-init:
        condition: service_completed_successfully
      keycloak-init:
        condition: service_completed_successfully
    restart: unless-stopped

  auth-admin-relay:
    logging: *logging
    image: dutyflow/auth-admin:${DUTYFLOW_VERSION:-dev}
    command: ["python", "-m", "auth_admin.relay"]
    healthcheck:
      disable: true
    environment: *auth-admin-env
    depends_on:
      auth-admin:
        condition: service_healthy
    restart: unless-stopped

  # Одноразово при каждом `up`: служебный клиент auth-admin, политика паролей и блокировок
  # realm (open-questions №61). Импорт realm-файла Keycloak делает только при первом запуске.
  keycloak-init:
    logging: *logging
    image: dutyflow/auth-admin:${DUTYFLOW_VERSION:-dev}
    command: ["python", "-m", "auth_admin.bootstrap"]
    healthcheck:
      disable: true
    environment:
      <<: *auth-admin-env
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Адреса возврата клиента SPA следуют за публичным адресом (например, при переходе на HTTPS)
      PUBLIC_URL: ${PUBLIC_URL}
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  gateway:
    logging: *logging
    build:
      context: ../frontend
    image: dutyflow/gateway:${DUTYFLOW_VERSION:-dev}
    ports:
      - "${GATEWAY_PORT:-8088}:80"
      - "${GATEWAY_HTTPS_PORT:-8443}:443"
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    volumes:
      # Шаблон: образ nginx подставляет PUBLIC_URL и кладёт результат в conf.d
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      org:
        condition: service_healthy
      personnel:
        condition: service_healthy
      scheduling:
        condition: service_healthy
      documents:
        condition: service_healthy
      analytics:
        condition: service_healthy
      auth-admin:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  # --- Эксплуатация (профиль ops: не стартуют с `up`, запускаются `dutyflow.sh`) ---

  # Резервное копирование и восстановление БД (open-questions №63)
  ops-db:
    profiles: ["ops"]
    image: postgres:16-alpine
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./postgres:/scripts:ro
      # Настройки стенда попадают в копию: без них копию не поднять на другом сервере.
      # Каталог копий (/backups) или копии (/restore) монтирует dutyflow.sh
      - ./.env:/config/.env:ro
      - ./certs:/config/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Проверка работоспособности изнутри сети стенда (`dutyflow.sh doctor`)
  ops:
    profiles: ["ops"]
    image: dutyflow/org:${DUTYFLOW_VERSION:-dev}
    command: ["python", "-m", "dutyflow_common.doctor"]
    logging: *logging
    healthcheck:
      disable: true
    environment:
      <<: *service-env
      CERTS_DIR: /certs
    volumes:
      - ./certs:/certs:ro
    restart: "no"

volumes:
  pgdata:
  redisdata:
