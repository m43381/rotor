[project]
name = "dutyflow-allocation"
version = "0.1.0"
description = "Сервис allocation: движок распределения — чистая функция «снимок → решение» (ADR-0006)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dutyflow-common",
    "numpy>=2.0",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
dutyflow-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allocation"]
