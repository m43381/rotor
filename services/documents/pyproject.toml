[project]
name = "dutyflow-documents"
version = "0.1.0"
description = "Сервис documents: шаблоны и импорт xlsx/csv, печатные формы (фаза 6)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dutyflow-common",
    "alembic>=1.14",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "weasyprint>=62",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
dutyflow-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/documents"]
