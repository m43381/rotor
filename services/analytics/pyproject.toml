[project]
name = "dutyflow-analytics"
version = "0.1.0"
description = "Сервис analytics: read-model нагрузки по событиям, метрики справедливости, дашборды (фаза 6c)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dutyflow-common",
    "alembic>=1.14",
    "openpyxl>=3.1",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
dutyflow-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]
