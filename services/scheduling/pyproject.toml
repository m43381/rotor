[project]
name = "dutyflow-scheduling"
version = "0.1.0"
description = "Сервис scheduling: типы нарядов, роли и требования; графики, делегирование, назначения"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dutyflow-common",
    "alembic>=1.14",
    "uvicorn[standard]>=0.32",
    "tzdata>=2024.1",
]

[tool.uv.sources]
dutyflow-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduling"]
