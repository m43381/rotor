name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — ruff, mypy, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy libs/common/src services/org/src services/personnel/src services/scheduling/src services/allocation/src services/documents/src services/analytics/src services/auth_admin/src tools
      # Интеграционные тесты поднимают PostgreSQL 16 через testcontainers (Docker есть на раннере)
      - run: uv run pytest libs/common -q
      - run: uv run pytest services/org -q
      - run: uv run pytest services/personnel -q
      - run: uv run pytest services/scheduling -q
      - run: uv run pytest services/allocation -q
      # Печать в PDF: системные библиотеки WeasyPrint и шрифты, как в образе documents
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation2
      - run: uv run pytest services/documents -q
      - run: uv run pytest services/analytics -q
      - run: uv run pytest services/auth_admin -q

  frontend:
    name: Frontend — eslint, vue-tsc, vitest, лицензии, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:licenses
      - run: npm run build

  api-types:
    name: Типы API фронтенда соответствуют OpenAPI сервисов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv python install 3.12 && uv sync --all-packages --frozen
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run gen:api
        working-directory: frontend
      - name: Сгенерированные файлы не должны отличаться от закоммиченных
        run: git diff --exit-code -- frontend/src/api/generated

  stand:
    name: Стенд — образы, HTTPS, e2e, копия и восстановление
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE: docker compose -f deploy/docker-compose.yml --env-file deploy/.env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv python install 3.12 && uv sync --all-packages --frozen
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Скрипты эксплуатации
        run: shellcheck deploy/dutyflow.sh deploy/postgres/*.sh
      - name: deploy/.env и сертификаты HTTPS (как `just env`)
        run: uv run python tools/make_env.py
      - name: Проверка compose
        run: $COMPOSE --profile ops config -q
      - name: Сборка образов
        run: $COMPOSE build
      - run: $COMPOSE up -d
      - name: Ожидание готовности (dutyflow.sh doctor)
        run: |
          for i in $(seq 1 60); do
            bash deploy/dutyflow.sh doctor > /dev/null 2>&1 && break
            sleep 10
          done
          bash deploy/dutyflow.sh doctor
      - name: Демо-данные (как `just seed`)
        run: |
          uv run python tools/gen/seed_org.py
          uv run python tools/gen/seed_people.py
          uv run python tools/gen/seed_duties.py
          uv run python tools/gen/seed_schedules.py
      - name: E2E по HTTPS
        working-directory: frontend
        env:
          PW_CHANNEL: chrome # предустановлен на раннере
        run: npx playwright test
      - name: Резервная копия и восстановление
        run: |
          bash deploy/dutyflow.sh backup
          bash deploy/dutyflow.sh restore "$(ls -d deploy/backups/2* | tail -n1)" --yes
          for i in $(seq 1 60); do
            bash deploy/dutyflow.sh doctor > /dev/null 2>&1 && break
            sleep 10
          done
          bash deploy/dutyflow.sh doctor
      - name: Журналы стенда
        if: failure()
        run: $COMPOSE logs --no-color > stand.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stand-logs
          path: |
            stand.log
            frontend/e2e-results
          retention-days: 7
